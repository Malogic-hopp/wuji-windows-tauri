[package]
name = "quantified-self-windows-tauri"
version = "0.1.0"
description = "WUJI dev-only Tauri shell"
authors = ["WUJI"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "wuji_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.24.0", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
