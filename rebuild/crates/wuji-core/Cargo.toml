[package]
name = "wuji-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# 边界（09 §4）：wuji-core 不依赖 Tauri、Win32 或 rusqlite。
# tests/boundary.rs 会把这条作为自动门禁执行。

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
ulid = "=3.0.0"
unicode-normalization = "=0.1.25"
