[package]
name = "wuji-rebuild-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "wuji-rebuild-agent-v01"
path = "src/main.rs"

[dependencies]
chrono-tz = "=0.10.4"
serde = "=1.0.229"
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt", "macros", "sync", "time", "io-util", "net", "signal"] }
ulid = "=3.0.0"
wuji-core = { path = "../../crates/wuji-core" }
wuji-storage = { version = "0.1.0", path = "../../crates/wuji-storage" }
wuji-windows = { path = "../../crates/wuji-windows" }

[dev-dependencies]
rusqlite = "=0.40.1"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["test-util"] }
